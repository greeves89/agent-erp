name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 06:00 UTC
  workflow_dispatch: # allows measuring main's build state on demand

permissions:
  contents: read
  security-events: write

jobs:
  # ── Python dependency audit ──────────────────────────────────────
  # ADVISORY BY DESIGN: every step ends in `|| true` on purpose. A newly
  # published CVE in a third-party dependency must not block unrelated PRs.
  # This job reports; it never gates. The gate is `image-build` below.
  python-audit:
    name: Python Dependency Audit (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit orchestrator dependencies
        run: |
          cd orchestrator
          pip install -r requirements.txt 2>/dev/null || true
          pip-audit -r requirements.txt --desc --fix --dry-run || true
          pip-audit -r requirements.txt --format json --output ../orchestrator-audit.json || true

      - name: Audit agent dependencies
        run: |
          cd agent
          pip install -r requirements.txt 2>/dev/null || true
          pip-audit -r requirements.txt --desc || true

      - name: Audit embedding-service dependencies
        run: |
          cd embedding-service
          pip-audit -r requirements.txt --desc || true

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-audit
          path: orchestrator-audit.json

  # ── Node.js dependency audit ─────────────────────────────────────
  # ADVISORY BY DESIGN — see the note on python-audit above.
  node-audit:
    name: Node.js Dependency Audit (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Audit frontend dependencies
        run: |
          cd frontend
          npm audit --audit-level=high || true
          npm audit --json > ../frontend-audit.json || true

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: node-audit
          path: frontend-audit.json

  # ── Image build gate + container scan ────────────────────────────
  # THIS JOB GATES. The build step has no `|| true`: if a Dockerfile stops
  # building — e.g. because `npm run build` or `pip install -r
  # requirements.txt` fails after a dependency bump — this check goes red.
  # That is the whole point: a green check set on a dependency PR must mean
  # "the image still builds".
  #
  # The Trivy steps that follow are explicitly NON-gating
  # (`continue-on-error`): vulnerability findings, and scanner problems such
  # as a failed DB download, must never be mistaken for a broken build.
  image-build:
    name: Image Build & Scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one broken context must not hide the state of the others
      matrix:
        context:
          - { name: orchestrator, path: ./orchestrator }
          - { name: agent, path: ./agent }
          - { name: frontend, path: ./frontend }
          - { name: embedding-service, path: ./embedding-service }
    steps:
      - uses: actions/checkout@v7

      - name: Build ${{ matrix.context.name }} image (gating)
        run: docker build -t scan-${{ matrix.context.name }}:local ${{ matrix.context.path }}

      - name: Run Trivy vulnerability scanner
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: scan-${{ matrix.context.name }}:local
          format: sarif
          output: trivy-${{ matrix.context.name }}.sarif
          severity: CRITICAL,HIGH
          exit-code: 0 # report findings, never fail the gate

      - name: Upload Trivy scan to GitHub Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.context.name }}.sarif
          category: trivy-${{ matrix.context.name }}

  # ── SAST — CodeQL ────────────────────────────────────────────────
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [python, javascript]
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: codeql-${{ matrix.language }}

  # ── Secret scanning ──────────────────────────────────────────────
  secrets-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified --results=verified
