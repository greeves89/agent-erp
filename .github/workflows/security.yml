name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 06:00 UTC
  workflow_dispatch: # allows measuring main's build state on demand

permissions:
  contents: read
  security-events: write

jobs:
  # ── Python dependency audit ──────────────────────────────────────
  # ADVISORY BY DESIGN: every step ends in `|| true` on purpose. A newly
  # published CVE in a third-party dependency must not block unrelated PRs.
  # This job reports; it never gates. The gate is `image-build` below.
  python-audit:
    name: Python Dependency Audit (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      # orchestrator/ and agent/ declare their dependencies in pyproject.toml —
      # NOT in a requirements.txt. Until 1.33.14 both steps ran
      # `pip-audit -r requirements.txt` and died with "invalid requirements
      # input", swallowed by `|| true`: the job reported green and audited
      # nothing at all. `pip-audit <path>` resolves a project directory.
      - name: Audit orchestrator dependencies
        run: |
          pip-audit orchestrator --desc || true
          pip-audit orchestrator --format json --output orchestrator-audit.json || true

      - name: Audit agent dependencies
        run: pip-audit agent --desc || true

      - name: Audit embedding-service dependencies
        run: pip-audit -r embedding-service/requirements.txt --desc || true

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-audit
          path: orchestrator-audit.json

  # ── Node.js dependency audit ─────────────────────────────────────
  # ADVISORY BY DESIGN — see the note on python-audit above.
  node-audit:
    name: Node.js Dependency Audit (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Audit frontend dependencies
        run: |
          cd frontend
          npm audit --audit-level=high || true
          npm audit --json > ../frontend-audit.json || true

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: node-audit
          path: frontend-audit.json

  # ── Image build gate + container scan ────────────────────────────
  # THIS JOB GATES. The build step has no `|| true`: if a Dockerfile stops
  # building after a dependency bump — `npm run build` for frontend,
  # `pip install -e .` from pyproject.toml for orchestrator and agent,
  # `pip install -r requirements.txt` for embedding-service — this check goes
  # red. That is the whole point: a green check set on a dependency PR must
  # mean "the image still builds".
  #
  # Accepted consequence: the gate is now coupled to upstream availability
  # (unpinned `npm install -g hyperframes`, apt repos, `torch>=2.14.1`). An
  # upstream breakage can redden an unrelated PR. That was always true — the
  # `|| true` just hid it, at the price of hiding real breakage too.
  #
  # The Trivy steps that follow are explicitly NON-gating
  # (`continue-on-error`): vulnerability findings, and scanner problems such
  # as a failed DB download, must never be mistaken for a broken build.
  image-build:
    name: Image Build & Scan
    runs-on: ubuntu-latest
    timeout-minutes: 45 # embedding-service pulls the full torch wheel set
    strategy:
      fail-fast: false # one broken context must not hide the state of the others
      matrix:
        context:
          - { name: orchestrator, path: ./orchestrator }
          - { name: agent, path: ./agent }
          - { name: frontend, path: ./frontend }
          - { name: embedding-service, path: ./embedding-service }
    steps:
      - uses: actions/checkout@v7

      - name: Build ${{ matrix.context.name }} image (gating)
        run: docker build -t scan-${{ matrix.context.name }}:local ${{ matrix.context.path }}

      - name: Run Trivy vulnerability scanner
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: scan-${{ matrix.context.name }}:local
          format: sarif
          output: trivy-${{ matrix.context.name }}.sarif
          severity: CRITICAL,HIGH
          exit-code: 0 # report findings, never fail the gate

      - name: Upload Trivy scan to GitHub Security
        # Only when a report exists: on a red build there is no SARIF, and an
        # upload step failing there is pure noise on top of the real error.
        if: hashFiles(format('trivy-{0}.sarif', matrix.context.name)) != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.context.name }}.sarif
          category: trivy-${{ matrix.context.name }}

  # ── SAST — CodeQL ────────────────────────────────────────────────
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [python, javascript]
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: codeql-${{ matrix.language }}

  # ── Secret scanning ──────────────────────────────────────────────
  secrets-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified --results=verified
